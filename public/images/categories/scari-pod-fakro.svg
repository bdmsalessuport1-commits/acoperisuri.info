<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Scari de pod FAKRO">
  <defs>
    <linearGradient id="bg-scari" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="0.55" stop-color="#00204A"/>
      <stop offset="1" stop-color="#001030"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9A56C"/>
      <stop offset="1" stop-color="#A5764A"/>
    </linearGradient>
    <linearGradient id="wood-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5A2E"/>
      <stop offset="0.5" stop-color="#B37E4F"/>
      <stop offset="1" stop-color="#8B5A2E"/>
    </linearGradient>
    <linearGradient id="fade-scari" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00204A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00204A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg-scari)"/>

  <!-- Ceiling frame (top of ladder) -->
  <g transform="translate(300,70)">
    <rect x="-20" y="0" width="240" height="35" fill="url(#wood-dark)" stroke="#5C3A17" stroke-width="1"/>
    <rect x="-20" y="35" width="240" height="5" fill="#5C3A17"/>

    <!-- Hatch opening -->
    <path d="M0 40 L200 40 L180 70 L20 70 Z" fill="#0d0d0d"/>
    <path d="M0 40 L200 40" stroke="#5C3A17" stroke-width="2"/>
  </g>

  <!-- Ladder - folded style, extending down -->
  <g transform="translate(315,110) rotate(15)">
    <!-- Left rail -->
    <path d="M0 0 L15 0 L45 300 L30 305 Z" fill="url(#wood)" stroke="#8B5A2E" stroke-width="0.5"/>
    <!-- Right rail -->
    <path d="M110 0 L125 0 L155 305 L140 300 Z" fill="url(#wood)" stroke="#8B5A2E" stroke-width="0.5"/>

    <!-- Rungs -->
    <rect x="8" y="30" width="120" height="8" fill="url(#wood-dark)" transform="rotate(4 68 34)"/>
    <rect x="10" y="65" width="122" height="8" fill="url(#wood-dark)" transform="rotate(5 71 69)"/>
    <rect x="12" y="100" width="125" height="8" fill="url(#wood-dark)" transform="rotate(6 74 104)"/>
    <rect x="14" y="135" width="128" height="8" fill="url(#wood-dark)" transform="rotate(7 78 139)"/>
    <rect x="16" y="170" width="131" height="9" fill="url(#wood-dark)" transform="rotate(8 82 174)"/>
    <rect x="18" y="205" width="134" height="9" fill="url(#wood-dark)" transform="rotate(9 85 209)"/>
    <rect x="20" y="240" width="137" height="9" fill="url(#wood-dark)" transform="rotate(10 89 244)"/>
    <rect x="22" y="275" width="140" height="10" fill="url(#wood-dark)" transform="rotate(11 92 280)"/>

    <!-- Wood grain lines -->
    <line x1="7" y1="5" x2="37" y2="290" stroke="#8B5A2E" stroke-width="0.5" opacity="0.5"/>
    <line x1="117" y1="5" x2="147" y2="295" stroke="#8B5A2E" stroke-width="0.5" opacity="0.5"/>

    <!-- Metal hinge accent (top) -->
    <circle cx="10" cy="15" r="4" fill="#c0c4cc" stroke="#5c5e60" stroke-width="0.5"/>
    <circle cx="120" cy="15" r="4" fill="#c0c4cc" stroke="#5c5e60" stroke-width="0.5"/>

    <!-- Red safety rail -->
    <path d="M-5 40 Q100 20 155 100 L155 240" fill="none" stroke="#E00808" stroke-width="4"/>
    <circle cx="-5" cy="40" r="4" fill="#E00808"/>
    <circle cx="155" cy="240" r="4" fill="#E00808"/>
  </g>

  <!-- FAKRO stamp -->
  <g transform="translate(60,120)">
    <rect x="0" y="0" width="90" height="24" fill="#E00808" opacity="0.9" rx="3"/>
    <text x="45" y="17" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="16" font-weight="900" fill="#fff">FAKRO</text>
  </g>

  <!-- Bottom fade -->
  <rect y="330" width="600" height="270" fill="url(#fade-scari)"/>

  <!-- Left red accent bar -->
  <rect x="40" y="410" width="6" height="70" fill="#E00808"/>

  <text x="60" y="450" font-family="'Public Sans','Arial Black',sans-serif" font-size="38" font-weight="900" fill="#fff" letter-spacing="1">SCARI DE POD</text>
  <text x="60" y="485" font-family="'Public Sans','Arial Black',sans-serif" font-size="22" font-weight="700" fill="#fff" opacity="0.95">FAKRO</text>

  <text x="60" y="518" font-family="'Roboto',sans-serif" font-size="18" fill="#fff" opacity="0.85">Acces sigur si confortabil</text>
  <text x="60" y="540" font-family="'Roboto',sans-serif" font-size="18" fill="#fff" opacity="0.85">la podul casei</text>

  <text x="60" y="578" font-family="'Public Sans',sans-serif" font-size="13" font-weight="700" fill="#fff" letter-spacing="2">VEZI MAI MULTE</text>
  <path d="M225 568 L245 573 L225 578 M225 573 L245 573" stroke="#E00808" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M245 568 L265 573 L245 578 M245 573 L265 573" stroke="#E00808" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M265 568 L285 573 L265 578 M265 573 L285 573" stroke="#E00808" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
