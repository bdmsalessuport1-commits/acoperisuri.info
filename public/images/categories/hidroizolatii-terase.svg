<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Hidroizolatii terase">
  <defs>
    <linearGradient id="bg-hidro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="0.55" stop-color="#00204A"/>
      <stop offset="1" stop-color="#001030"/>
    </linearGradient>
    <linearGradient id="membrane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A4550"/>
      <stop offset="1" stop-color="#1E252E"/>
    </linearGradient>
    <linearGradient id="waterdrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3E6"/>
      <stop offset="0.5" stop-color="#14A4D4"/>
      <stop offset="1" stop-color="#0E6A96"/>
    </linearGradient>
    <linearGradient id="fade-hidro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00204A" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00204A" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg-hidro)"/>

  <!-- Terrace with membrane (isometric slice) -->
  <g transform="translate(200,80)">
    <!-- Concrete slab (bottom) -->
    <path d="M0 200 L280 250 L400 220 L120 170 Z" fill="#C4C8CC"/>
    <path d="M0 200 L0 260 L280 310 L280 250 Z" fill="#8A8E93"/>
    <path d="M280 250 L280 310 L400 280 L400 220 Z" fill="#A6ABAE"/>

    <!-- Insulation panel -->
    <path d="M0 165 L280 215 L400 185 L120 135 Z" fill="#E8DCC2"/>
    <path d="M0 165 L0 200 L280 250 L280 215 Z" fill="#B39F7D"/>
    <path d="M280 215 L280 250 L400 220 L400 185 Z" fill="#D0BD9E"/>

    <!-- Membrane sheet (dark, wavy) -->
    <path d="M-20 130 L260 180 L390 148 L100 100 Z" fill="url(#membrane)"/>
    <path d="M-20 130 L-20 165 L260 215 L260 180 Z" fill="#0d1117"/>
    <path d="M260 180 L260 215 L390 185 L390 148 Z" fill="#1E252E"/>

    <!-- Rolled up part -->
    <ellipse cx="90" cy="90" rx="45" ry="15" fill="url(#membrane)"/>
    <ellipse cx="90" cy="80" rx="45" ry="15" fill="url(#membrane)"/>
    <ellipse cx="90" cy="70" rx="45" ry="15" fill="url(#membrane)"/>
    <ellipse cx="90" cy="60" rx="45" ry="15" fill="url(#membrane)"/>
    <ellipse cx="90" cy="50" rx="45" ry="15" fill="#0d1117"/>
    <ellipse cx="90" cy="45" rx="42" ry="14" fill="none" stroke="#3A4550" stroke-width="0.8"/>

    <!-- Torch line hint (bitumen application) -->
    <path d="M340 150 Q360 130 380 145" fill="none" stroke="#E00808" stroke-width="1" opacity="0.4"/>
    <path d="M345 155 Q365 138 385 150" fill="none" stroke="#E00808" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Water drops falling -->
  <g opacity="0.95">
    <path d="M110 100 Q100 130 110 145 Q120 130 110 100 Z" fill="url(#waterdrop)"/>
    <ellipse cx="105" cy="128" rx="3" ry="4" fill="#fff" opacity="0.6"/>

    <path d="M85 60 Q78 82 85 94 Q92 82 85 60 Z" fill="url(#waterdrop)"/>
    <ellipse cx="82" cy="82" rx="2" ry="3" fill="#fff" opacity="0.6"/>

    <path d="M155 40 Q148 60 155 70 Q162 60 155 40 Z" fill="url(#waterdrop)" opacity="0.85"/>
    <ellipse cx="153" cy="58" rx="2" ry="2.5" fill="#fff" opacity="0.6"/>

    <path d="M45 190 Q37 210 45 220 Q53 210 45 190 Z" fill="url(#waterdrop)" opacity="0.9"/>
    <ellipse cx="43" cy="208" rx="2" ry="2.5" fill="#fff" opacity="0.6"/>

    <path d="M180 260 Q172 283 180 296 Q188 283 180 260 Z" fill="url(#waterdrop)" opacity="0.85"/>
    <ellipse cx="178" cy="281" rx="2" ry="3" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Shield mark - protection symbol -->
  <g transform="translate(490,100)" opacity="0.9">
    <path d="M0 0 L30 5 L30 25 Q30 40 15 50 Q0 40 0 25 Z" fill="#12A757" stroke="#fff" stroke-width="1.5"/>
    <path d="M6 20 L13 27 L24 15" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom fade -->
  <rect y="330" width="600" height="270" fill="url(#fade-hidro)"/>

  <!-- Left red accent bar -->
  <rect x="40" y="410" width="6" height="70" fill="#E00808"/>

  <text x="60" y="450" font-family="'Public Sans','Arial Black',sans-serif" font-size="38" font-weight="900" fill="#fff" letter-spacing="1">HIDROIZOLATII</text>
  <text x="60" y="485" font-family="'Public Sans','Arial Black',sans-serif" font-size="24" font-weight="700" fill="#fff" opacity="0.95">Terase</text>

  <text x="60" y="518" font-family="'Roboto',sans-serif" font-size="18" fill="#fff" opacity="0.85">Sisteme impermeabile</text>
  <text x="60" y="540" font-family="'Roboto',sans-serif" font-size="18" fill="#fff" opacity="0.85">de durata</text>

  <text x="60" y="578" font-family="'Public Sans',sans-serif" font-size="13" font-weight="700" fill="#fff" letter-spacing="2">VEZI MAI MULTE</text>
  <path d="M225 568 L245 573 L225 578 M225 573 L245 573" stroke="#E00808" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M245 568 L265 573 L245 578 M245 573 L265 573" stroke="#E00808" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M265 568 L285 573 L265 578 M265 573 L285 573" stroke="#E00808" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
